# MCP23S17 driver is enabled automatically from the devicetree node
CONFIG_SPI=y

#CONFIG_PWM=y

# Enable deep sleep. Timeout is in ms, 900000 is 15 minutes. 
# Battery level is shown after waking from deep sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_BT_BAS=y
CONFIG_BT=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Generate a uf2 file to be loaded by the adafruit bootloader.  Not setting
# this will use the zephyr provided bootloader and will require nrfjprog to 
# program the board. The uf2 memory map comes from the board's /uf2 variant.
CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# &bootloader support for the Adafruit nRF52 bootloader (Zephyr 4.1 boot retention)
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_ZMK_BOOTMODE_MAGIC_VALUE_BOOTLOADER_TYPE_ADAFRUIT_NRF52=y

CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB_INIT_PRIORITY=50

# Turn on logging, and set ZMK logging to debug output
#CONFIG_ZMK_USB_LOGGING=y